<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bàn việc của Thiện</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap">
<style>
/* Layout kiểu Things: máy tính có menu trái (mục + nhóm + sắp tới), iPhone có thanh dưới đáy. "Hôm nay" mở đầu bằng 3 thẻ việc chính.
   Phong cách Apple: nền xám #F5F5F7, thẻ trắng không viền, chữ #1D1D1F, xanh #0071E3 cho hành động, thanh mờ kính, nút bo tròn hẳn. */
:root{
  --bg:#F5F5F7; --card:#FFFFFF; --ink:#1D1D1F; --soft:#6E6E73; --faint:#AEAEB2; --line:#E8E8ED; --hover:#EDEDF0;
  --accent:#0071E3; --accent-soft:#E8F1FC; --glass:rgba(255,255,255,.72);
  --brand:#FF3B30; --brand-soft:#FFEDEC; --sun:#FF9500; --sun-soft:#FFF3E0; --ok:#34C759; --ok-soft:#E9F8EE; --later:#8E8E93;
  --display:"Montserrat",-apple-system,system-ui,sans-serif; --body:"Montserrat",-apple-system,system-ui,sans-serif;
  --shadow:0 2px 14px rgba(0,0,0,.045);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --ink:#F5F5F7; --soft:#98989D; --faint:#636366; --line:#2C2C2E; --hover:#2C2C2E;
  --accent:#2997FF; --accent-soft:#0B2A47; --glass:rgba(22,22,23,.72);
  --brand:#FF453A; --brand-soft:#3A1614; --sun:#FF9F0A; --sun-soft:#33230A; --ok:#30D158; --ok-soft:#0E2A17; --later:#8E8E93;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --ink:#F5F5F7; --soft:#98989D; --faint:#636366; --line:#2C2C2E; --hover:#2C2C2E;
  --accent:#2997FF; --accent-soft:#0B2A47; --glass:rgba(22,22,23,.72);
  --brand:#FF453A; --brand-soft:#3A1614; --sun:#FF9F0A; --sun-soft:#33230A; --ok:#30D158; --ok-soft:#0E2A17; --later:#8E8E93;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px calc(96px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
@media (min-width:900px){.app{grid-template-columns:230px minmax(0,1fr);column-gap:40px;padding-bottom:60px}}

/* sidebar (máy tính) */
.side{display:none}
@media (min-width:900px){.side{display:flex;flex-direction:column;gap:18px;position:sticky;top:24px;align-self:start;max-height:calc(100vh - 48px);overflow:auto;scrollbar-width:none}}
.brandt{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em;padding:0 10px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--ink);font:500 15px var(--body);padding:8px 10px;border-radius:10px;cursor:pointer;text-align:left;width:100%}
.nav button:hover{background:var(--hover)}
.nav button[aria-current="true"]{background:var(--card);box-shadow:var(--shadow);font-weight:600}
.nav button .n{margin-left:auto;font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums;font-weight:500}
.nav button[data-v="today"] svg{color:var(--sun)} .nav button[data-v="hot"] svg{color:var(--brand)} .nav button[data-v="later"] svg{color:var(--later)} .nav button[data-v="ideas"] svg{color:var(--sun)} .nav button[data-v="report"] svg{color:var(--ok)}
.navh{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:6px 10px 2px}
.nav .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);margin:0 5px;flex:none}
.mini{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px 12px 4px}
.mini h3{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:0 0 4px}
.agenda{list-style:none;margin:0;padding:0}
.agenda li{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.35}
.agenda li:first-child{border-top:0}
.agenda .dd{font-family:var(--display);font-weight:700;font-size:16px;line-height:1;text-align:center}
.agenda .dd small{display:block;font-family:var(--body);font-size:10px;font-weight:600;color:var(--soft);margin-top:2px}
.agenda .tx{align-self:center}
.agenda li.soon .dd{color:var(--brand)}
.foot{font-size:12px;color:var(--faint);line-height:1.5;padding:0 10px}

/* thanh dưới (iPhone) */
.bbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){.bbar{display:none}}
.bbar button{flex:1;border:0;background:none;color:var(--faint);font:600 11px var(--body);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;position:relative;min-height:48px}
.bbar button svg.i{width:23px;height:23px}
.bbar button[aria-current="true"]{color:var(--ink)}
.bbar button .bn{position:absolute;top:2px;left:calc(50% + 8px);background:var(--brand);color:#fff;font-size:10px;line-height:16px;min-width:16px;height:16px;border-radius:8px;padding:0 4px}

/* header */
main{min-width:0;display:flex;flex-direction:column;gap:26px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:16px}
.date{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.hello{font-family:var(--display);font-weight:800;font-size:clamp(28px,5.5vw,40px);line-height:1.05;letter-spacing:-.025em;margin:6px 0 0;text-wrap:balance}
.hello em{font-style:normal;color:var(--brand)}
.ring{flex:none;width:72px;height:72px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bgc{stroke:var(--line)} .ring .fg{stroke:var(--ok);transition:stroke-dashoffset .5s ease}
.ring .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:18px}
.rpbtn{flex:none;border:0;background:var(--card);box-shadow:var(--shadow);color:var(--ok);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
@media (min-width:900px){.rpbtn{display:none}}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:-12px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:0;background:none;color:var(--soft);font:500 13.5px var(--body);padding:6px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips.mob{}
@media (min-width:900px){.chips.mob{display:none}}

/* 3 thẻ việc chính */
.focus3{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media (min-width:640px){.focus3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.fc{position:relative;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;min-height:0;border:1.5px solid transparent;transition:border-color .2s}
@media (min-width:640px){.fc{min-height:150px}}
.fc.hot{border-color:var(--brand-soft)}
.fc .no{font-family:var(--display);font-weight:800;font-size:15px;color:var(--faint)}
.fc .tl{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.25;letter-spacing:-.01em;flex:1;word-break:break-word}
.fc .ft{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fc .ft .meta{margin:0}
.fc.done .tl{color:var(--faint);text-decoration:line-through;text-decoration-thickness:1px}
.fc .x{position:absolute;top:8px;right:8px;border:0;background:none;color:var(--faint);width:32px;height:32px;border-radius:50%;cursor:pointer;display:grid;place-items:center;opacity:.7}
.fc .x:hover{background:var(--sun-soft);color:var(--sun);opacity:1}
.fc.empty{background:none;box-shadow:none;border:1.5px dashed var(--line);align-items:center;justify-content:center;text-align:center;color:var(--faint);font-size:14px}
.fc .circle{width:30px;height:30px}
.fc .sub{display:none;font-size:12.5px;color:var(--soft);font-family:var(--body);font-weight:500;margin-top:2px;letter-spacing:0}
@media (max-width:639px){.fc{flex-direction:row;align-items:center;padding:12px 44px 12px 14px;gap:12px}.fc .ft{order:-1}.fc .ft .meta{display:none}.fc .no{display:none}.fc .tl{font-size:16.5px}.fc .sub{display:block}.fc.empty{padding:14px}}
.cheer{display:flex;align-items:center;gap:12px;background:var(--ok-soft);color:var(--ok);border-radius:14px;padding:12px 16px;font-weight:600}

/* danh sách */
.blk h2{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.01em;margin:0 0 2px;display:flex;align-items:center;gap:8px}
.blk h2 small{font-family:var(--body);font-size:13px;font-weight:500;color:var(--faint)}
.blk .hint{color:var(--soft);font-size:13.5px;margin:0 0 4px}
.box{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:2px 6px}
.tasks{list-style:none;margin:0;padding:0}
.task{border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.trow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;padding:11px 6px}
.circle{width:24px;height:24px;border-radius:50%;border:2px solid var(--faint);background:transparent;cursor:pointer;display:grid;place-items:center;margin-top:1px;transition:all .18s;padding:0;flex:none}
.circle svg{width:13px;height:13px;stroke:#fff;stroke-width:3;fill:none;opacity:0;transform:scale(.6);transition:all .18s}
.circle:hover{border-color:var(--ok)}
.done .circle,.circle[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.done .circle svg,.circle[aria-pressed="true"] svg{opacity:1;transform:scale(1)}
.title{font-size:15.5px;font-weight:500;line-height:1.4;word-break:break-word}
.task.done .title{color:var(--faint);text-decoration:line-through;text-decoration-thickness:1px}
[contenteditable]{outline:none;border-radius:6px;cursor:text;-webkit-user-select:text;user-select:text}
[contenteditable]:hover{background:var(--hover)}
[contenteditable]:focus{background:var(--hover);box-shadow:0 0 0 2px var(--brand-soft)}
.meta{font-size:12.5px;color:var(--soft);margin-top:3px;display:flex;flex-wrap:wrap;gap:3px 9px;align-items:center}
.meta .fire{color:var(--brand);font-weight:600;background:var(--brand-soft);padding:0 7px;border-radius:5px;font-size:12px}
.meta .due{color:var(--ink);font-weight:500}
.meta .later{color:var(--later)}
.meta .okd{color:var(--ok)}
.acts{display:flex;align-items:center;gap:0;margin-top:-5px}
.ib{border:0;background:none;cursor:pointer;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--faint);transition:all .15s;padding:0}
.ib:hover{background:var(--hover);color:var(--ink)}
.ib.sun:hover{background:var(--sun-soft);color:var(--sun)}
.ib.sun[aria-pressed="true"]{color:var(--sun)}
.ib.sun[aria-pressed="true"] svg{fill:currentColor}
.ib.del:hover{background:var(--brand-soft);color:var(--brand)}
.ib.del.sure{background:var(--brand);color:#fff;width:auto;padding:0 10px;border-radius:999px;font:600 12.5px var(--body)}
.ib.more[aria-expanded="true"]{background:var(--hover);color:var(--ink)}
@media (hover:hover) and (min-width:900px){.task .ib.del:not(.sure){opacity:0}.task:hover .ib.del,.task:focus-within .ib.del{opacity:1}}
.drawer{padding:0 6px 14px 44px;display:flex;flex-direction:column;gap:10px}
.seg{display:inline-flex;background:var(--line);border-radius:10px;padding:3px;gap:2px;width:max-content;max-width:100%}
.seg button{border:0;background:none;color:var(--soft);font:600 13px var(--body);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button[data-pri="hot"][aria-pressed="true"]{color:var(--brand)}
.dr2{display:flex;gap:8px;flex-wrap:wrap}
.dr2 select,.dr2 input,.drawer textarea{border:1px solid var(--line);background:var(--bg);color:var(--ink);font:14.5px var(--body);padding:8px 10px;border-radius:10px}
.dr2 select{flex:1 1 150px;min-width:0}
.dr2 input{flex:0 1 130px;min-width:0}
.drawer textarea{width:100%;resize:vertical;min-height:58px;line-height:1.5}
.drawer .src{font-size:12px;color:var(--faint)}
.dr3{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dr3 .xdel{border:0;background:none;color:var(--soft);font:600 13px var(--body);padding:6px 10px;border-radius:8px;cursor:pointer;display:flex;gap:6px;align-items:center}
.dr3 .xdel:hover{color:var(--brand);background:var(--brand-soft)}
.dr3 .xdel.sure{background:var(--brand);color:#fff}
@media (max-width:899px){.trow .ib.del:not(.sure){display:none}}
.empty{padding:16px 6px;color:var(--soft);font-size:15px}
.add{display:flex;align-items:center;gap:10px;padding:8px 6px}
.add .plus{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--brand);font-size:22px;line-height:1;flex:none}
.add input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:16px var(--body);padding:6px 0}
.add input::placeholder{color:var(--faint)}
.add input:focus{outline:none}
.add select{border:0;background:transparent;color:var(--soft);font:500 13px var(--body);padding:4px 0;max-width:34%;text-align:right;cursor:pointer}
.more-btn{border:0;background:none;color:var(--soft);font:600 14px var(--body);padding:10px 6px;cursor:pointer}
.more-btn:hover{color:var(--ink)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);font-size:14px;font-weight:500;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:all .2s;z-index:20;white-space:nowrap}
@media (min-width:900px){.toast{bottom:24px}}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--brand);color:#fff}

/* ý tưởng */
.idea{padding:12px 8px;border-bottom:1px solid var(--line);font-size:15.5px;display:flex;gap:12px;align-items:flex-start}
.idea:last-child{border-bottom:0}
.idea::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--sun);margin-top:10px}
.idea .itx{flex:1;min-width:0}
.idea .acts2{flex:none;display:flex;gap:6px;margin-top:-1px}
.idea .mk{border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 12.5px var(--body);padding:5px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.idea .mk:hover{border-color:var(--ink)}
.idea .rm{border:0;background:none;color:var(--faint);font:600 12.5px var(--body);padding:5px 8px;border-radius:8px;cursor:pointer;white-space:nowrap}
.idea .rm:hover{color:var(--brand);background:var(--brand-soft)}
.idea .rm.sure{color:#fff;background:var(--brand)}
.ideaform{display:flex;flex-direction:column;gap:8px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px}
.ideaform textarea{border:0;background:none;color:var(--ink);font:16px/1.5 var(--body);resize:none;min-height:52px;padding:2px 0}
.ideaform textarea::placeholder{color:var(--faint)}
.ideaform textarea:focus{outline:none}
.ideaform .row2{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.ideaform select{border:0;background:var(--line);color:var(--soft);font:500 13px var(--body);border-radius:8px;padding:7px 8px;max-width:65%}
.ideaform button{border:0;background:var(--ink);color:var(--bg);font:600 14px var(--body);border-radius:10px;padding:9px 16px;cursor:pointer}

/* báo cáo */
.rp-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.rp-h .when{font-size:13px;color:var(--soft)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px 14px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:12.5px;color:var(--soft);font-weight:500}
.kpi .v{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.15;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--soft)}
.kpi .s.up{color:var(--ok)} .kpi .s.down{color:var(--brand)}
.kpi.warn .v{color:var(--brand)}
.month{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.month .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.month .big{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em}
.month .big small{font-family:var(--body);font-size:14px;color:var(--soft);font-weight:500}
.month .when{font-size:13px;color:var(--soft)}
.bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:999px}
.month .note2{font-size:13.5px;color:var(--soft)}
.rsec{display:flex;flex-direction:column;gap:6px}
.rsec h3{font-family:var(--display);font-weight:700;font-size:17px;margin:0;display:flex;gap:8px;align-items:center}
.rsec h3 .tone{width:9px;height:9px;border-radius:50%;background:var(--faint)}
.rsec.hot h3 .tone{background:var(--brand)} .rsec.ok h3 .tone{background:var(--ok)} .rsec.sun h3 .tone{background:var(--sun)}
.rsec ul{margin:0;padding:0;list-style:none;background:var(--card);border-radius:16px;box-shadow:var(--shadow)}
.rsec li{padding:11px 16px;border-top:1px solid var(--line);font-size:15px;line-height:1.5}
.rsec li:first-child{border-top:0}
.rsec li b{font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Apple polish ===== */
body{font-size:15px;letter-spacing:-.005em}
.brandt{font-weight:700;font-size:21px;letter-spacing:-.03em}
.date{font-size:14px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--sun)}
.hello{font-weight:700;font-size:clamp(30px,5.4vw,48px);letter-spacing:-.035em;line-height:1.08}
.hello em{color:var(--accent)}
.ring .fg{stroke:var(--accent)} .ring .bgc{stroke:var(--line)}
.ring .lbl{font-weight:700;font-size:16px;letter-spacing:-.02em}
.nav button{font-size:14px;font-weight:500;border-radius:10px;padding:8px 10px}
.nav button[aria-current="true"]{background:var(--hover);box-shadow:none;font-weight:600}
.nav button[data-v="today"] svg{color:var(--sun)} .nav button[data-v="hot"] svg{color:var(--brand)} .nav button[data-v="all"] svg{color:var(--accent)} .nav button[data-v="ideas"] svg{color:#FFCC00} .nav button[data-v="report"] svg{color:var(--ok)}
.navh{letter-spacing:.02em;text-transform:none;font-size:12.5px;color:var(--soft)}
.nav .dot{background:var(--accent);opacity:.55}

  --accent:#CC1C01; --accent-soft:#FFF1EC; --glass:rgba(255,255,255,.88);
  --brand:#CC1C01; --brand-soft:#FFECEA; --sun:#E8890C; --sun-soft:#FFF5E5; --ok:#0F8A5F; --ok-soft:#E8F6F0; --later:#8B7B77;
  --display:"Inter",system-ui,-apple-system,sans-serif; --body:"Inter",system-ui,-apple-system,sans-serif;
  --shadow:0 1px 2px rgba(31,20,20,.04),0 4px 16px rgba(77,13,13,.05); --land:#E8F4E0; --land2:#D9EBCB;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#150E0D; --card:#201615; --ink:#F7EFEC; --soft:#C9B8B3; --faint:#A39390; --line:#33262A; --hover:#2A1D1B;
  --accent:#FF6A4D; --accent-soft:#3A1A14; --glass:rgba(32,22,21,.85);
  --brand:#FF6A4D; --brand-soft:#3A1A14; --sun:#FFB04A; --sun-soft:#3A2810; --ok:#34C98E; --ok-soft:#10281F; --shadow:none}}
:root[data-theme="dark"]{
  --bg:#150E0D; --card:#201615; --ink:#F7EFEC; --soft:#C9B8B3; --faint:#A39390; --line:#33262A; --hover:#2A1D1B;
  --accent:#FF6A4D; --accent-soft:#3A1A14; --glass:rgba(32,22,21,.85);
  --brand:#FF6A4D; --brand-soft:#3A1A14; --sun:#FFB04A; --sun-soft:#3A2810; --ok:#34C98E; --ok-soft:#10281F; --shadow:none}
body{overflow-x:hidden;font-size:14px;font-weight:400;letter-spacing:0;font-feature-settings:"tnum" 1,"cv11" 1}
.app{position:relative}
.app:before{content:"";position:absolute;top:-60px;right:-12%;width:760px;height:340px;background:conic-gradient(from 210deg at 60% 50%,#ffd2b0,#fead5f,#ff7a4d,#cc1c01,#ffd2b0);filter:blur(64px);opacity:.30;transform:skewY(-8deg);pointer-events:none;z-index:0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .app:before{opacity:.18}}
:root[data-theme="dark"] .app:before{opacity:.18}
.app>*{position:relative;z-index:1}
.brandt{font-weight:700;font-size:18px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.brandt:before{content:"BV";width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#cc1c01,#fead5f);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;letter-spacing:0}
.nav button{font-size:14px;font-weight:500;color:var(--soft);border-radius:8px}
.nav button:hover{background:var(--hover);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--brand-soft);color:var(--brand);font-weight:600;box-shadow:none}
.nav button svg{color:currentColor!important;opacity:.85}
.nav button .n{color:var(--faint)}
.navh{color:var(--faint);font-size:12px;font-weight:600}
.nav .dot{background:var(--brand);opacity:.5}
.mini{border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:var(--shadow)}
.mini h3{font-size:13px;font-weight:600;color:var(--ink)}
.agenda li{border-top:1px solid var(--line)}
.agenda .dd{font-weight:700;font-size:17px;letter-spacing:-.02em}
.foot{color:var(--faint)}
.date{color:var(--faint);font-size:13px;font-weight:500}
.hello{font-size:clamp(26px,4.4vw,32px);font-weight:700;letter-spacing:-.025em;line-height:1.2}
.hello em{color:var(--brand);font-weight:700}
.ring .fg{stroke:var(--brand)} .ring .bgc{stroke:var(--line)}
.ring .lbl{font-weight:600;font-size:14px}
.rpbtn{border:1px solid var(--line);box-shadow:none;color:var(--brand)}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--soft);font-weight:500;font-size:13px;border-radius:999px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.box,.fc,.ideaform,.kpi,.month,.rsec ul,.coach,.rv,.wkbox,.fz,.eve{border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.eve{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.eve button,.pill{background:var(--brand)}
.pill.ghost{background:var(--hover);color:var(--ink)}
.blk h2{font-size:15px;font-weight:600;letter-spacing:-.01em}
.blk .hint{color:var(--faint)}
.fc{padding:16px;min-height:150px;border:1px solid var(--line)}
.fc.hot{box-shadow:var(--shadow);border-color:var(--line)}
.fc .no{color:var(--brand);font-weight:600;font-size:12px}
.fc .tl{font-weight:600;font-size:15px;letter-spacing:-.01em}
.fc.empty{border:1px dashed var(--line);box-shadow:none;background:transparent}
.task{border-bottom:1px solid var(--line)}
.title{font-size:14.5px;font-weight:550;letter-spacing:-.005em}
.circle{border:1.5px solid #D9CAC4}
.circle:hover{border-color:var(--ok)}
.done .circle,.circle[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.meta{font-size:12.5px;color:var(--faint)}
.meta .fire{background:var(--brand-soft)!important;color:var(--brand);border-radius:999px;padding:1px 8px!important;font-weight:600;font-size:11.5px}
.meta .okd{color:var(--ok)}
.ib:hover{background:var(--hover)}
.ib.tm{background:var(--hover)!important;border:1px solid var(--line)!important;color:var(--soft)!important}
.ib.tm[aria-pressed="true"]{background:var(--ink)!important;border-color:var(--ink)!important;color:var(--bg)!important}
.ib.sun[aria-pressed="true"]{color:var(--sun)}
.seg{background:var(--hover);border-radius:8px}
.seg button{font-weight:500}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink)}
.dr2 select,.dr2 input,.drawer textarea,.rv textarea,.search,.fzsel{border:1px solid var(--line);background:var(--card);border-radius:8px}
.search{box-shadow:none;border:1px solid var(--line)}
.add .plus{color:var(--brand)}
.add select{color:var(--soft)}
.more-btn{color:var(--soft)}
.more-btn:hover{color:var(--ink);text-decoration:none}
.cheer{background:var(--ok-soft);color:var(--ok);border-radius:12px}
.idea::before{background:var(--peach,#fead5f)}
.idea .mk{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:8px}
.idea .rm{border-radius:8px}
.ideaform button{background:var(--brand);border-radius:8px}
.ideaform select{border-radius:8px;background:var(--hover)}
.kpi .v{font-size:24px;font-weight:650;letter-spacing:-.02em}
.bar i{background:linear-gradient(90deg,#fead5f,#cc1c01)}
.month .big{font-weight:700;letter-spacing:-.03em}
.rsec h3{font-size:15px;font-weight:600}
.rsec li{border-top:1px solid var(--line)}
.bbar{background:var(--glass);border-top:1px solid var(--line)}
.bbar button[aria-current="true"]{color:var(--brand)}
.bbar button .bn{background:var(--brand)}
.toast{background:var(--ink);color:var(--bg);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.14)}
.fzgo{background:var(--brand)}
.fzring .fg{stroke:var(--brand)}
.mmwrap{border:1px solid var(--line);border-radius:12px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.themebar{display:flex;justify-content:flex-end;margin-bottom:-12px}
.theme{display:inline-flex;background:var(--hover);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.theme button{border:0;background:none;padding:4px 11px;border-radius:6px;font:500 12.5px var(--body);color:var(--soft);cursor:pointer;white-space:nowrap}
.theme button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
:root[data-theme="dark"] .pill,:root[data-theme="dark"] .eve button,:root[data-theme="dark"] .ideaform button,:root[data-theme="dark"] .fzgo,:root[data-theme="dark"] .mmb.pri,:root[data-theme="dark"] .ib.del.sure,:root[data-theme="dark"] .dr3 .xdel.sure,:root[data-theme="dark"] .mmb.sure,:root[data-theme="dark"] .toast.err{color:#1F0A06}
:root[data-theme="dark"] .pill.ghost{color:var(--ink)}
:root[data-theme="dark"] .circle svg{stroke:#10281F}
:root[data-theme="dark"] .meta .fire{color:#FF8A70}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.slot{min-height:170px;border-radius:12px;border:1.5px dashed var(--line);display:flex;flex-direction:column}
.slot.over{border-color:var(--brand);background:var(--brand-soft)}
.slot .empty{margin:auto;text-align:center;color:var(--faint);padding:16px;font-size:13px}
.slot .empty b{display:block;color:var(--brand);font-size:12px;font-weight:600;margin-bottom:4px}
.dc{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:10px;flex:1;margin:-1.5px;cursor:grab}
.dc.drag,.task.drag{opacity:.4}
.dc .no{font-size:12px;font-weight:600;color:var(--brand);display:flex;align-items:center}
.dc .no .grip{margin-left:auto;color:var(--faint)}
.dc .tl{font-weight:600;font-size:15px;line-height:1.4;flex:1;word-break:break-word}
.dc .ft{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dc .ft .meta{margin:0}
.dc .ft .sp{margin-left:auto;display:flex;gap:4px;align-items:center}
.mn{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:3px 8px;font:500 12px var(--body);color:var(--soft);cursor:pointer}
.mn:hover{border-color:var(--brand);color:var(--brand)}
#todozone.over{outline:2px dashed var(--brand);outline-offset:4px;border-radius:12px}
.grip2{cursor:grab;color:var(--faint);padding:6px 8px;font-size:14px;letter-spacing:1px;user-select:none;-webkit-user-select:none;align-self:center;touch-action:none}
.grip2:hover{color:var(--brand)}
.dc *{user-select:none;-webkit-user-select:none}
@media (max-width:640px){.slots{grid-template-columns:minmax(0,1fr)}.slot{min-height:0}}
</style>
<div class="app">

</div>

<button class="fzpill" id="fzpill" data-v="focus" hidden aria-label="Về màn tập trung"></button>

<script>
const $=s=>document.querySelector(s);
(function(){const root=document.documentElement;let m="auto";try{m=localStorage.getItem("bv-theme")||"auto"}catch(_){}
const mq=matchMedia("(prefers-color-scheme: dark)");
function apply(){const eff=(m==="dark"||m==="light")?m:(mq.matches?"dark":"light");root.setAttribute("data-theme",eff);document.querySelectorAll("#theme button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.t===m)))}
apply(); if(mq.addEventListener) mq.addEventListener("change",()=>{if(m==="auto")apply()});
const th=document.getElementById("theme"); if(th) th.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;m=b.dataset.t;try{localStorage.setItem("bv-theme",m)}catch(_){}apply()});})();
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const todayVN=()=>new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Ho_Chi_Minh"}).format(new Date());
const tomorrowVN=()=>new Date(Date.parse(todayVN())+864e5).toISOString().slice(0,10);
const hourVN=()=>+new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Ho_Chi_Minh",hour:"numeric",hourCycle:"h23"}).format(new Date());
const byPick=(a,b)=>(a.pickAt||0)-(b.pickAt||0)||(a.order??0)-(b.order??0);
const dowOf=D=>{const [y,m,d]=D.split("-").map(Number);return `${DOW[new Date(Date.UTC(y,m-1,d)).getUTCDay()]} ${d}/${m}`};
const fmt=d=>{if(!d)return"";const p=d.split("-");return p.length===3?`${+p[2]}/${+p[1]}`:d};
const level=t=>t.pri==="hot"?"hot":t.pri==="later"?"later":"norm";
const DOW=["Chủ nhật","Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy"];
const sv=p=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
const I={
  sun:sv('<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/>'),
  flame:sv('<path d="M12 21c4 0 6.5-2.7 6.5-6.3 0-3.9-3-6.3-4.2-10.2-2.3 1.6-3.6 3.9-3.6 6.3-1-.6-1.7-1.6-2-2.8C6.9 9.6 5.5 11.9 5.5 14.7 5.5 18.3 8 21 12 21z"/>'),
  list:sv('<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>'),
  hour:sv('<path d="M6.5 3h11M6.5 21h11M7.5 3c0 4.5 4.5 5.5 4.5 9s-4.5 4.5-4.5 9M16.5 3c0 4.5-4.5 5.5-4.5 9s4.5 4.5 4.5 9"/>'),
  bulb:sv('<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/>'),
  chart:sv('<path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/>'),
  dots:sv('<circle cx="5.5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18.5" cy="12" r="1.2"/>'),
  trash:sv('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'),
  x:sv('<path d="M6 6l12 12M18 6L6 18"/>'),
  alert:sv('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5.2M12 16.2v.3"/>'),
  moon:sv('<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>'),
  up:sv('<path d="M12 19V5M6 11l6-6 6 6"/>'),
  mind:sv('<circle cx="12" cy="12" r="2.6"/><circle cx="4.5" cy="6" r="1.7"/><circle cx="19.5" cy="6" r="1.7"/><circle cx="4.5" cy="18" r="1.7"/><circle cx="19.5" cy="18" r="1.7"/><path d="M9.8 10.7 6 7.2M14.2 10.7 18 7.2M9.8 13.3 6 16.8M14.2 13.3 18 16.8"/>'),
  tree:sv('<path d="M12 3 6.5 10h3L6 15.5h12L14.5 10h3zM12 15.5V21"/>'),
  child:sv('<path d="M4 6h6v12h4M10 12h4"/><rect x="14" y="9.5" width="6" height="5" rx="1.5"/><rect x="14" y="15.5" width="6" height="5" rx="1.5"/>'),
  sib:sv('<rect x="4" y="4" width="10" height="6" rx="1.5"/><rect x="4" y="14" width="10" height="6" rx="1.5"/><path d="M18 14v6M15 17h6"/>'),
  pen:sv('<path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/>'),
  fold:sv('<path d="M7 9l5 5 5-5"/>'),
  undo:sv('<path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/>'),
  task:sv('<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/>'),
  check:sv('<circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.2l2.5 2.5 4.5-5"/>')
};
const TICK='<svg viewBox="0 0 14 14"><path d="M2.5 7.5l3 3 6-7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const NAV=[["today","Hôm nay","sun"],["tomorrow","Ngày mai","moon"],["hot","Gấp","alert"],["all","Tất cả","list"],["later","Để sau","hour"],["done","Đã xong","check"],["ideas","Ý tưởng","bulb"],["focus","Tập trung","tree"],["report","Báo cáo","chart"]];
let tasks=[], ideas=[], meta={}, report=null, dayNote=null, q="", db=null, canWrite=true;
const BASE_TITLE=document.title||"Bàn việc";
let view="today", chip="Tất cả", openId=null, showMoreDone=false, showAllHot=false, confirmDel=null, delT, confirmRm=null, rmT, busyIdea=false;
try{const v=localStorage.getItem("bv-view"); if(v&&(NAV.some(n=>n[0]===v)||v.startsWith("g:"))) view=v;}catch(e){}

let toastT; function toast(msg,err){const t=$("#toast"); t.textContent=msg; t.className="toast show"+(err?" err":""); clearTimeout(toastT); toastT=setTimeout(()=>t.className="toast"+(err?" err":""),1800);}
const groupsOf=()=>meta.groups&&meta.groups.length?meta.groups:[...new Set(tasks.map(t=>t.group))];
const byOrder=(a,b)=>(a.order??0)-(b.order??0);
const openT=()=>tasks.filter(t=>t.status!=="done");

function chrome(){
  const T=todayVN(), [y,m,d]=T.split("-").map(Number), dow=new Date(Date.UTC(y,m-1,d)).getUTCDay(), op=openT();
  $("#date").textContent=`${DOW[dow]}, ${d} tháng ${m}`;
  const td=tasks.filter(t=>t.today===T), done=td.filter(t=>t.status==="done").length, left=td.length-done;
  const TM=tomorrowVN(), N={tomorrow:tasks.filter(t=>t.today===TM&&t.status!=="done").length,today:left,hot:op.filter(t=>level(t)==="hot").length,all:op.filter(t=>level(t)!=="later").length,later:op.filter(t=>level(t)==="later").length,ideas:ideas.reduce((a,g)=>a+(g.items||[]).length,0),report:"",done:tasks.filter(t=>t.status==="done").length,focus:fzLog.filter(x=>x.date===T&&x.status==="done").length};
  $("#nav").innerHTML=NAV.map(([k,l,ic])=>`<button data-v="${k}" aria-current="${view===k}">${I[ic]}${l}<span class="n">${N[k]||""}</span></button>`).join("");
  $("#gnav").innerHTML=groupsOf().map(g=>{const n=op.filter(t=>t.group===g&&level(t)!=="later").length;return `<button data-v="g:${esc(g)}" aria-current="${view==="g:"+g}"><span class="dot"></span>${esc(g)}<span class="n">${n||""}</span></button>`}).join("");
  $("#bbar").innerHTML=NAV.filter(n=>["today","tomorrow","all","hot","ideas","focus"].includes(n[0])).map(([k,l,ic])=>`<button data-v="${k}" aria-current="${view===k||(k==="all"&&view.startsWith("g:"))}">${I[ic]}${l}${k==="hot"&&N.hot?`<span class="bn">${N.hot}</span>`:""}</button>`).join("");
  $("#modesw").innerHTML=modeSw();
  $("#rpbtn").innerHTML=I.chart; $("#rpbtn").setAttribute("aria-current",String(view==="report"));
  let msg;
  if(!db) msg="Chưa kết nối được dữ liệu.";
  else if(view==="today") msg=!td.length?"Chưa chọn việc nào. Chọn <em>3 việc chính</em> cho hôm nay.":!left?"<em>Xong hết</em> việc hôm nay.":`Hôm nay còn <em>${left} việc</em>.`;
  else if(view==="tomorrow") msg=`Ngày mai <em>${esc(dowOf(TM))}</em> làm gì?`;
  else if(view.startsWith("g:")) msg=esc(view.slice(2));
  else if(view==="focus") msg=fz?(fz.kind==="break"?"Đang <em>nghỉ</em>":"Đang <em>tập trung</em>"):"Tập trung, <em>trồng cây</em>";
  else msg={hot:"Việc <em>gấp</em>",all:"Tất cả việc",later:"Để sau",done:"Việc <em>đã xong</em>",ideas:"Kho ý tưởng",report:"Báo cáo web"}[view];

  const el=document.querySelector(`#mmstage .mmn[data-nid="${CSS.escape(id)}"] .mmt`), n=mmById(id), t=mmTask(n);
  if(n&&t&&el&&!cancel){const v=el.textContent.replace(/\s+/g," ").trim().slice(0,200)||n.t;
    if(v!==n.t){ if(n.kind==="task") mmDo(t.id,{title:v,edited:true,...(t.origTitle?{}:{origTitle:t.title})},"✎ Đã đổi tên việc");
      else {const subs=subsOf(t);const s=subs.find(x=>x.id===n.sid);if(s){s.t=v;mmDo(t.id,{subs})}} }}
  mmBuild();
}
function mmNewTask(grp,title,detail){
  const T=todayVN(), id="t"+Date.now().toString(36)+rid().slice(0,3);
  const data={group:grp,title:title||"Việc mới",detail:detail||"",pri:view==="later"?"later":view==="hot"?"hot":"",due:"",src:"Mind map",status:"open",today:view==="today"?T:view==="tomorrow"?tomorrowVN():"",pickAt:view==="today"||view==="tomorrow"?Date.now():0,doneAt:"",order:9999,createdAt:T,updatedAt:new Date().toISOString()};
  tasks.push({id,...data}); mmUndo.push({tid:id,old:{status:"removed",today:""}});
  db.collection("tasks").doc(id).set(data).catch(()=>toast("Chưa thêm được việc",true));
  mmCol.delete("g:"+grp); return "t:"+id;
}
function mmAdd(id,kind){
  const n=mmById(id); if(!n||!db||!canWrite) return; let nid=null;
  if(n.kind==="sub"||(n.kind==="task"&&kind==="child")){
    const t=mmTask(n), subs=subsOf(t), sid=rid();
    if(n.kind==="task") subs.push({id:sid,p:"",t:"Ý mới"});
    else if(kind==="child") subs.push({id:sid,p:n.sid,t:"Ý mới"});
    else{const me=subs.find(x=>x.id===n.sid);subs.splice(subs.indexOf(me)+1,0,{id:sid,p:me.p||"",t:"Ý mới"})}
    mmDo(t.id,{subs}); mmCol.delete(n.id); nid="s:"+t.id+":"+sid;
  }
  else if(n.kind==="task") nid=mmNewTask(mmTask(n).group);
  else if(n.kind==="group"&&kind==="child") nid=mmNewTask(n.grp);
  else if(n.kind==="root"&&kind==="child"&&(view==="today"||view==="tomorrow"||view.startsWith("g:"))) nid=mmNewTask(view.startsWith("g:")?view.slice(2):(groupsOf()[0]||"Kỳ Tích"));
  else {toast(n.kind==="group"?"Chọn nhóm rồi bấm Tab để thêm việc vào nhóm đó":"Chọn một nhóm rồi bấm Tab để thêm việc");return}
  mmSel=nid; mmBuild(); mmStartEdit(nid);
}
function mmDel(id){
  const n=mmById(id), t=mmTask(n); if(!n||!t||!canWrite) return;
  if(n.kind==="sub"){const subs=subsOf(t),gone=subDesc(subs,n.sid),sib=mmKids(n.p),i=sib.indexOf(n),nx=sib[i+1]||sib[i-1];mmDo(t.id,{subs:subs.filter(s=>!gone.has(s.id))});mmSel=nx?nx.id:n.p;mmBuild();return}

  if(mmDelArm!==id){mmDelArm=id;mmMarkSel();toast("Bấm Xoá lần nữa để xoá việc này");clearTimeout(mmDelT);mmDelT=setTimeout(()=>{mmDelArm=null;mmMarkSel()},4000);return}
  mmDelArm=null; const sib=mmKids(n.p),i=sib.indexOf(n),nx=sib[i+1]||sib[i-1];
  mmDo(t.id,{status:"removed",removedAt:todayVN(),today:""},"🗑 Đã xoá việc"); mmSel=nx?nx.id:n.p; mmBuild();
}
function mmToggle(id){const n=mmById(id);if(!n||!n.p||!mmKids(id).length)return;mmCol.has(id)?mmCol.delete(id):mmCol.add(id);try{localStorage.setItem("bv-mmcol",JSON.stringify([...mmCol]))}catch(_){}mmBuild()}
function mmShift(id,d){
  const n=mmById(id); if(!n||n.kind!=="sub") return; const t=mmTask(n), subs=subsOf(t), me=subs.find(x=>x.id===n.sid), sib=subs.filter(x=>(x.p||"")===(me.p||"")), o=sib[sib.indexOf(me)+d]; if(!o) return;

function mmNav(k){
  const n=mmById(mmSel); if(!n) return; const p=mmPos[n.id]; if(!p) return; const dir=p.dir;
  const goKids=s=>{if(n.c)mmToggle(n.id);const ks=mmKids(n.id).filter(x=>mmPos[x.id]&&(dir!==0||mmPos[x.id].dir===s));if(ks.length){ks.sort((a,b)=>mmPos[a.id].y-mmPos[b.id].y);mmSel=ks[Math.floor((ks.length-1)/2)].id}};
  if(k==="ArrowRight"){ if(dir>=0) goKids(1); else mmSel=n.p }
  else if(k==="ArrowLeft"){ if(dir<=0) goKids(-1); else mmSel=n.p }
  else if(n.p){ const sib=mmKids(n.p).filter(x=>mmPos[x.id]&&mmPos[x.id].dir===dir).sort((a,b)=>mmPos[a.id].y-mmPos[b.id].y), i=sib.indexOf(n), o=sib[i+(k==="ArrowUp"?-1:1)]; if(o) mmSel=o.id }

function mmTaskAct(a){
  const n=mmById(mmSel), t=mmTask(n); if(!t||n.kind!=="task") return; const T=todayVN();
  if(a==="done"){const d=t.status!=="done";mmDo(t.id,d?{status:"done",doneAt:T}:{status:"open",doneAt:""},d?"Xong một việc ✓":"Đã mở lại việc")}
  else{const on=t.today!==T,patch={today:on?T:"",pickAt:on?Date.now():0};if(on&&level(t)==="later")patch.pri="";mmDo(t.id,patch,on?"☀ Đã thêm vào hôm nay":"Đã bỏ khỏi hôm nay")}
  mmBuild();
}
async function mmToTask(id){
  const n=mmById(id), t=mmTask(n); if(!n||n.kind!=="sub"||!t) return;
  const nid=mmNewTask(t.group,n.t,`Tách từ việc: ${t.title}`);
  const subs=subsOf(t), gone=subDesc(subs,n.sid); mmDo(t.id,{subs:subs.filter(s=>!gone.has(s.id))},`Đã thành việc → ${t.group}`); mmSel=nid; mmBuild();

function mmAction(a){
  const w=$("#mmwrap");
  if(a==="zin"||a==="zout"){mmZoomAt(mmZ*(a==="zin"?1.2:1/1.2),w.clientWidth/2,w.clientHeight/2);return}
  if(a==="fit"){mmFit();return}
  if(a==="full"){mmFull=!mmFull;mmNeedFit=true;render(true);return}
  if(a==="undo"){mmUndoDo();return}
  if(!mmSel) return;
  if(a==="child"||a==="sib") mmAdd(mmSel,a);
  else if(a==="edit") mmStartEdit(mmSel);
  else if(a==="fold") mmToggle(mmSel);
  else if(a==="del") mmDel(mmSel);
  else if(a==="done"||a==="sun") mmTaskAct(a);
  else if(a==="totask") mmToTask(mmSel);
}
document.addEventListener("keydown",e=>{
  if(!mindOn()||!mm||e.isComposing||e.keyCode===229) return;
  const k=e.key, mod=e.metaKey||e.ctrlKey;
  if(mmEdit&&e.target.closest&&e.target.closest(".mmt[contenteditable]")){
    if(k==="Enter"&&!e.shiftKey){e.preventDefault();mmCommit()}
    else if(k==="Tab"){e.preventDefault();const id=mmEdit;mmCommit();mmAdd(id,"child")}
    else if(k==="Escape"){e.preventDefault();mmCommit(true)}
    return;
  }
  if(e.target.closest&&e.target.closest("input,select,textarea,[contenteditable]")) return;
  if(k==="Escape"&&mmFull){mmFull=false;mmNeedFit=true;render(true);return}
  if(mod&&k.toLowerCase()==="z"){e.preventDefault();mmUndoDo();return}
  if(!mmSel){if(k==="Tab"||k==="Enter"||k.startsWith("Arrow")){e.preventDefault();mmSel="root";mmMarkSel()}return}
  if(mod&&k==="Enter"){e.preventDefault();mmTaskAct("done")}
  else if(k==="Tab"){e.preventDefault();mmAdd(mmSel,"child")}
  else if(k==="Enter"){e.preventDefault();mmAdd(mmSel,"sib")}
  else if(k==="Delete"||k==="Backspace"){e.preventDefault();mmDel(mmSel)}
  else if(k==="F2"||k===" "){e.preventDefault();mmStartEdit(mmSel)}
  else if(k.startsWith("Arrow")){e.preventDefault();if(e.altKey&&(k==="ArrowUp"||k==="ArrowDown"))mmShift(mmSel,k==="ArrowUp"?-1:1);else mmNav(k)}
  else if(k.length===1&&!mod&&!e.altKey){const n=mmById(mmSel);if(n&&(n.kind==="task"||n.kind==="sub"))mmStartEdit(mmSel)}
});

  const ti=e.target.closest&&e.target.closest("[data-title]");
  if(ti&&e.key==="Enter"){e.preventDefault();ti.blur()}
  if(ti&&e.key==="Escape"){const t=tasks.find(x=>x.id===ti.dataset.title); if(t) ti.textContent=t.title; ti.blur()}
  if(e.target.matches&&e.target.matches("[data-fdue]")&&e.key==="Enter"){e.preventDefault();e.target.blur()}
});
document.addEventListener("focusout",e=>{
  const el=e.target;
  if(el.matches&&el.matches("[data-title]")){const v=el.textContent.replace(/\s+/g," ").trim(), t=tasks.find(x=>x.id===el.dataset.title); if(t&&!v) el.textContent=t.title; else if(t&&v!==t.title) saveEdit(t.id,{title:v},"✎ Đã đổi tên việc")}
  else if(el.matches&&el.matches("[data-fdue]")) saveEdit(el.dataset.fdue,{due:el.value.trim()},"Đã lưu hạn");
  else if(el.matches&&el.matches("[data-fdetail]")) saveEdit(el.dataset.fdetail,{detail:el.value.trim()},"Đã lưu ghi chú");
  else if(el.id==="daynote"&&db&&el.value.trim()!==(dayNote||"")){const v=el.value.trim(), T=todayVN(); dayNote=v; db.doc("days/"+T).set({date:T,note:v,updatedAt:new Date().toISOString()}).then(()=>toast("Đã lưu ghi chú cuối ngày"),()=>toast("Chưa lưu được ghi chú",true))}
  setTimeout(()=>{if(pending&&!typingEdit()) render()},0);
});
/* Không cho kéo chữ từ việc này thả vào tên việc khác (dễ dính 2 việc vào nhau). */
const elOf=n=>n&&n.nodeType===3?n.parentElement:n;
["dragover","drop"].forEach(ev=>document.addEventListener(ev,e=>{const t=elOf(e.target); if(t&&t.closest&&t.closest("[data-title]")) e.preventDefault()}));
document.addEventListener("dragstart",e=>{const t=elOf(e.target); if(t&&t.closest&&t.closest("#view")) e.preventDefault()});
document.addEventListener("input",e=>{if(e.target.id==="tmq"){q=e.target.value;render()}
  if(e.target.id==="fzrange"){fzCfg.min=+e.target.value;const te=$("#fztime");if(te)te.textContent=String(fzCfg.min).padStart(2,"0")+":00";const g=$("#fzgo");if(g)g.textContent=`🌱 Trồng cây · ${fzCfg.min} phút`;document.querySelectorAll("[data-fzmin]").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.fzmin===fzCfg.min)))}});
document.addEventListener("change",e=>{const g=e.target.closest&&e.target.closest("[data-fg]"); if(g) saveEdit(g.dataset.fg,{group:g.value},"Đã đổi nhóm");
  const id=e.target.id;
  if(id==="fzrange"){fzSaveCfg();e.target.blur()}
  if(id==="fztask"){fzCfg.task=e.target.value;fzSaveCfg();e.target.blur()}
  if(id==="fzstrict"){fzCfg.strict=e.target.checked;fzSaveCfg()}
});

render();
(async()=>{
  db=window.claude?await window.claude.use("db"):null;
  if(!db){render();fzLoop();return}
  try{const u=await window.claude.use("user"); const w=u?await u.can("data.write"):null; if(w===false)canWrite=false;}catch(_){}
  db.collection("tasks").onSnapshot(s=>{tasks=s.docs.map(d=>({id:d.id,...d.data()})).filter(t=>t.status!=="removed"); if(openId&&!tasks.some(t=>t.id===openId)) openId=null; render()},()=>toast("Mất kết nối dữ liệu, tải lại trang",true));
  db.collection("ideas").onSnapshot(s=>{ideas=s.docs.map(d=>({id:d.id,...d.data()})).sort(byOrder);render()},()=>{});
  db.collection("focus").onSnapshot(s=>{fzLog=s.docs.map(d=>({id:d.id,...d.data()}));if(view==="focus"&&!fz)render();else chrome()},()=>{});
  fzLoop();
  db.doc("reports/latest").onSnapshot(s=>{report=s.exists?s.data():null;render()},()=>{});
  db.doc("days/"+todayVN()).onSnapshot(s=>{const a=document.activeElement; if(a&&a.id==="daynote") return; dayNote=s.exists?(s.data().note||""):""; render()},()=>{});
  db.doc("meta/info").onSnapshot(s=>{meta=s.exists?s.data():{};if(meta.syncedAt)$("#foot").textContent=`Bấm vào tên việc để sửa. ☀ là làm hôm nay, 🌙 là chọn việc cho ngày mai. Đồng bộ wiki lần cuối ${meta.syncedAt}.`;render()},()=>{});
})();
</script>
